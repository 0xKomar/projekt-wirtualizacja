services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in .env}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p "$$DB_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      BACKEND_PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Set BACKEND_PORT in .env}:${BACKEND_PORT:?Set BACKEND_PORT in .env}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['BACKEND_PORT'] + '/api/health', timeout=8).close()"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
    ports:
      - "${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  frontend:
  backend:
