services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in .env}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p "$$DB_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  frontend:
  backend:
