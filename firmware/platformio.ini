[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASSWORD="${sysenv.WIFI_PASSWORD}"'
    '-DBACKEND_URL="${sysenv.BACKEND_URL}"'
    '-DDEVICE_KEY="${sysenv.DEVICE_KEY}"'

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32dev-http]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DALLOW_INSECURE_HTTP=1

[env:esp32s3-http]
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DALLOW_INSECURE_HTTP=1
