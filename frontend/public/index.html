<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise monitor</title>
  <!-- Leaflet from unpkg; integrity makes the browser reject a changed file. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header class="card">
    <div>
      <h1>Noise monitor</h1>
      <p class="muted">Poznań</p>
    </div>
    <span id="status" class="status">Checking...</span>
  </header>

  <div class="card legend">
    <span class="badge quiet">&lt; 55 dB</span>
    <span class="badge medium">55-70 dB</span>
    <span class="badge loud">&gt; 70 dB</span>
    <span class="badge offline">offline</span>
    <span class="muted">uncalibrated values</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
